name: homebase

services:
  app:
    image: ${IMAGE:?set by the deploy workflow}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://homebase:${POSTGRES_PASSWORD:?set in .env}@db:5432/homebase
      PUBLIC_URL: https://${SITE_ADDRESS:?set in .env}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: homebase
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebase"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
