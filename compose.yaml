services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://homebase:homebase@db:5432/homebase
      PUBLIC_URL: http://localhost:8000
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: homebase
      POSTGRES_DB: homebase
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
